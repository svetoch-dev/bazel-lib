name: Pull requests

on:
  pull_request:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: "${{ vars.BAZELISK_IMAGE }}"
    steps:
    - uses: actions/checkout@v7.0.1
    - name: test
      run: bazel test //...
