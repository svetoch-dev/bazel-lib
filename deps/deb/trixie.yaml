#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the trixie.lock.json run the following command
#
#     bazel run @svetoch_bazel_lib_trixie//:lock
version: 1

sources:
  - channel: trixie main
    urls:
      - https://snapshot.debian.org/archive/debian/20260706T142243Z
      - https://snapshot-cloudflare.debian.org/archive/debian/20260706T142243Z

  - channel: trixie-security main
    urls:
      - https://snapshot.debian.org/archive/debian-security/20260706T142243Z
      - https://snapshot-cloudflare.debian.org/archive/debian-security/20260706T142243Z
  - channel: trixie-updates main
    urls:
      - https://snapshot.debian.org/archive/debian/20260706T142243Z
      - https://snapshot-cloudflare.debian.org/archive/debian/20260706T142243Z

archs:
  - "amd64"

packages:
  # base image
  - "ncurses-base"
  - "libncurses6"
  - "tzdata"
  - "bash"
  - "coreutils" # for commands like `ls`
  - "grep"
  ## for apt list --installed
  - "dpkg"
  - "apt"
  - "perl"
  - "sed" #needed by py_binary rules
  - "mawk" #needed by py_binary rules +  mtree_mutate + rules_distroless.flatten
  # bazelisk deps
  - "git" #used in scripts/ci/ci.sh
  - "curl" #used in scripts/ci/ci.sh
  - "gzip" #used in scripts/ci/ci.sh
  - "libc6-dev" #assert.h, stdlib.h etc used by dpkg_status to compile packages
  - "g++" #used by dpkg_status to compile packages
  - "libc-bin" #contains getent cli that is needed by tf to lookup HOME dir if its not set needed for rules_tf
  - "gcc" #needed by bazel
  - "findutils" #needed for requirements.txt.lock tests
  - "python3" #needed for requirements.txt.lock tests
